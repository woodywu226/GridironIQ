[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-parlay-prediction"
version = "0.1.0"
description = "NFL probability modeling and parlay analytics for research and portfolio demonstration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
